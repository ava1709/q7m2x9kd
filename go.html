<!doctype html>
<!-- Мостик к приложениям на телефоне: из Telegram открываются только https-ссылки, поэтому карта (index.html)
     открывает эту страницу в браузере, а она открывает место ссылкой geo: — Android сам показывает окно
     «Открыть с помощью» только с установленными картами и навигаторами. Адрес: go.html?lat=<широта>&lon=<долгота>&n=<номер АЗС>. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршрут до АЗС</title>
<style>
  :root { --bg: #ffffff; --text: #16201b; --text-3: #7d8984; --chip: #f1f4f2; --accent: #12865a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17191c; --text: #eef2f0; --text-3: #8b9590; --chip: #262a2e; } }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 360px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { color: var(--text-3); margin: 0 0 22px; font-size: 14.5px; }
  a { display: block; padding: 13px; border-radius: 12px; margin-top: 10px; font-weight: 700; text-decoration: none;
    background: var(--chip); color: var(--text); }
  a.main { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
  <h1 id="title">Выберите приложение</h1>
  <p id="text">Телефон покажет карты и навигаторы, которые на нём установлены. В приложении нажмите «Маршрут» или «Поехали».</p>
  <a class="main" id="pick" href="#">Выбрать приложение</a>
  <a id="maps" href="#">Маршрут в Яндекс Картах</a>
</main>
<script>
(() => {
  "use strict";
  const p = new URLSearchParams(location.search);
  const lat = Number(p.get("lat")), lon = Number(p.get("lon"));
  const num = String(p.get("n") || "").replace(/[^0-9A-Za-zА-Яа-я-]/g, "").slice(0, 12);
  const $ = (id) => document.getElementById(id);
  if (!p.get("lat") || !p.get("lon") || !Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
    $("title").textContent = "Нет координат АЗС";
    $("text").textContent = "Вернитесь в Telegram и выберите АЗС на карте ещё раз.";
    $("pick").remove();
    $("maps").remove();
    return;
  }
  const label = encodeURIComponent(num ? `АЗС №${num}` : "АЗС");
  const geo = `geo:${lat},${lon}?q=${lat},${lon}(${label})`;
  $("pick").href = geo;
  $("maps").href = `https://yandex.ru/maps/?rtext=~${lat},${lon}&rtt=auto`;
  location.href = geo;                              // браузер может не пустить без нажатия — тогда кнопка выше
})();
</script>
</body>
</html>
